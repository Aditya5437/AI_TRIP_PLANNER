services:

  fastapi:

    build:
      context: .
      dockerfile: Dockerfile.fastapi

    container_name: trip_fastapi

    ports:
      - "8000:8000"

    env_file:
      - .env

  streamlit:

    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: trip_streamlit

    ports:
      - "8501:8501"

    depends_on:
      - fastapi